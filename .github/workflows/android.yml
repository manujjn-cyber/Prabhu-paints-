name: Build Android pilot APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      shop_url:
        description: 'Deployed HTTPS origin, e.g. https://your-shop.example.com'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate app URL and build
        env:
          SHOP_URL: ${{ inputs.shop_url || 'https://prabhu-paints-shop-production.up.railway.app' }}
        working-directory: android
        run: gradle --no-daemon assembleDebug "-PshopUrl=$SHOP_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: Prabhu-Paints-Pilot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

