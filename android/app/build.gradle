plugins { id 'com.android.application' }
def shopUrl = providers.gradleProperty('shopUrl').getOrElse('')
if (!(shopUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?\/?/)) {
    throw new GradleException('Set -PshopUrl=https://YOUR-DEPLOYED-SHOP-HOST (origin only)')
}
android {
    namespace 'in.prabhupaints.shop'
    compileSdk 35
    defaultConfig {
        applicationId 'in.prabhupaints.shop.atelier'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-atelier-pilot'
        buildConfigField 'String', 'SHOP_URL', '"' + shopUrl.replaceAll('/$', '') + '/"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
