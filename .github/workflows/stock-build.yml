name: Build offline stock shell
on:
  push:
    branches: [stock-offline-20260927]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon -p stock-shell/android assembleDebug
      - run: |
          mkdir -p output
          cp stock-shell/android/app/build/outputs/apk/debug/app-debug.apk output/shell.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/
      - uses: actions/upload-artifact@v4
        with:
          name: offline-shell
          path: output/*
          retention-days: 3
