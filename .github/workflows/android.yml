name: Build Prabhu Ledger APK
on:
  push:
    branches: [prabhu-ledger-apk-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: mkdir -p ledger-apk && tar -xzf ledger-apk-src.tar.gz -C ledger-apk
      - working-directory: ledger-apk/android
        run: gradle assembleDebug --stacktrace
      - run: cp ledger-apk/android/app/build/outputs/apk/debug/app-debug.apk Prabhu-Ledger.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Prabhu-Ledger-APK
          path: Prabhu-Ledger.apk
          retention-days: 14
