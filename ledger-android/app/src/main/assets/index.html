<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>VKS Party Ledger</title>
<style>
:root{--ink:#17212b;--muted:#6b7280;--bg:#f4f6f8;--card:#fff;--brand:#1f4f46;--gold:#b98a3d;--green:#087f5b;--red:#c92a2a;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#173c35,#245c51);color:white;padding:18px 16px 14px;box-shadow:0 2px 14px #0002}header h1{font-size:20px;margin:0}header small{opacity:.8}.wrap{padding:12px;max-width:760px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #0000000a}.stat{padding:10px}.stat b{display:block;font-size:16px;margin-top:4px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.controls input,.controls select,.modal input,.modal select,.modal textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white;font:inherit}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:700;background:var(--brand);color:white}.btn.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}.toolbar{display:flex;gap:8px;margin:10px 0}.toolbar .btn{flex:1}.entry{padding:12px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px}.date{font-weight:700}.part{font-size:15px;margin:6px 0}.amt{font-weight:800;font-size:16px}.credit{color:var(--green)}.debit{color:var(--red)}.balance{font-weight:700}.meta{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2f7;font-size:11px;margin-right:5px}.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-top:8px}.photoBtn{margin-top:8px;padding:7px 9px;border:1px solid #d1d5db;background:white;border-radius:8px}.modalBack{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal{background:white;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.modal h2{margin:0 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}.note{background:#fff8db;border:1px solid #ffe066;padding:10px;border-radius:10px;margin:8px 0;font-size:12px}.empty{text-align:center;color:var(--muted);padding:30px}.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:28px;border:0;background:var(--gold);color:white;box-shadow:0 8px 24px #0004}.source{font-size:11px;color:#8a8f98}@media(min-width:600px){.modalBack{align-items:center;justify-content:center}.modal{max-width:540px;border-radius:20px}.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>VKS Party Ledger</h1><small>Prabhu Paints • Imported from supplied workbook</small></header><div class="wrap"><div class="stats" id="stats"></div><div class="controls"><select id="fy"></select><input id="q" placeholder="Search date, bill, payment, note..."></div><div class="toolbar"><button class="btn alt" onclick="exportData()">Export Backup</button><button class="btn alt" onclick="showIssues()">Data Flags</button></div><div id="list"></div></div><button class="fab" onclick="openAdd()">+</button>
<div class="modalBack" id="modalBack"><div class="modal"><h2 id="mtitle">Add Entry</h2><div class="grid2"><div><label>Date</label><input type="date" id="mdate"></div><div><label>Financial year</label><select id="mfy"><option>2024-25</option><option>2025-26</option><option>2026-27</option></select></div></div><label>Particular</label><input id="mpart" placeholder="Bill / Payment / Recharge / note"><div class="grid2"><div><label>Credit / Bill ₹</label><input id="mcr" inputmode="decimal" type="number" step="0.01"></div><div><label>Debit / Payment ₹</label><input id="mdr" inputmode="decimal" type="number" step="0.01"></div></div><label>Notes</label><textarea id="mnotes" rows="2"></textarea><label>Bill / payment picture</label><input id="mphoto" type="file" accept="image/*" capture="environment"><div class="meta">Use Camera or choose an existing bill/payment image.</div><div id="photoPreview"></div><div class="note">Imported workbook rows are preserved as source records. New entries are stored separately on this phone.</div><div class="toolbar"><button class="btn alt" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEntry()">Save Entry</button></div></div></div>
<script src="ledger_data.js"></script><script>
const KEY='vks_user_entries_v1', IMG='vks_images_v1'; let editId=null, pendingPhoto=null;
const user=()=>JSON.parse(localStorage.getItem(KEY)||'[]'); const saveUser=x=>localStorage.setItem(KEY,JSON.stringify(x)); const imgs=()=>JSON.parse(localStorage.getItem(IMG)||'{}'); const saveImgs=x=>localStorage.setItem(IMG,JSON.stringify(x));
function money(n){return n==null?'—':'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})} function all(){return [...SOURCE_LEDGER,...user()]}
function init(){['All','2026-27','2025-26','2024-25'].forEach(x=>fy.innerHTML+=`<option>${x}</option>`); fy.value='2026-27'; fy.onchange=render; q.oninput=render; mphoto.onchange=readPhoto; render()}
function render(){let arr=all(), f=fy.value, s=q.value.trim().toLowerCase(); if(f!='All')arr=arr.filter(x=>x.fy==f); if(s)arr=arr.filter(x=>(x.date+' '+x.particular+' '+x.notes+' '+(x.credit||'')+' '+(x.debit||'')).toLowerCase().includes(s));
 let cr=arr.reduce((a,x)=>a+(+x.credit||0),0), dr=arr.reduce((a,x)=>a+(+x.debit||0),0), bal=cr-dr; stats.innerHTML=`<div class=stat><small>Entries</small><b>${arr.length}</b></div><div class=stat><small>Credit</small><b class=credit>${money(cr)}</b></div><div class=stat><small>Debit</small><b class=debit>${money(dr)}</b></div><div class=stat><small>Balance</small><b>${money(bal)}</b></div>`;
 list.innerHTML=arr.length?'':`<div class=empty>No matching entries</div>`; const im=imgs(); arr.slice().reverse().forEach(x=>{let a=x.credit!=null?`<span class="amt credit">+ ${money(x.credit)}</span>`:`<span class="amt debit">− ${money(x.debit)}</span>`; let ph=im[x.id]?`<img class=thumb src="${im[x.id]}">`:''; list.innerHTML+=`<div class="card entry"><div class=row><span class=date>${x.date||'Date not entered'}</span>${a}</div><div class=part>${esc(x.particular)}</div><div class=row><span><span class=badge>${x.fy}</span><span class=badge>${x.source==='Imported XLSX'?'SOURCE':'USER'}</span></span><span class=balance>Bal: ${money(x.balance)}</span></div>${x.notes?`<div class=meta>${esc(x.notes)}</div>`:''}${ph}<div><button class=photoBtn onclick="openEntry('${x.id}')">${im[x.id]?'View / change picture':'Add picture / edit'}</button></div><div class=source>${x.source==='Imported XLSX'?'Workbook row '+x.sourceRow:'Added in app'}</div></div>`})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openAdd(){editId=null; [mdate,mfy,mpart,mcr,mdr,mnotes].forEach(el=>el.disabled=false); mtitle.textContent='Add Entry'; mdate.value=new Date().toISOString().slice(0,10); mfy.value=fy.value==='All'?'2026-27':fy.value; mpart.value='';mcr.value='';mdr.value='';mnotes.value='';mphoto.value='';pendingPhoto=null;photoPreview.innerHTML='';modalBack.style.display='flex'}
function openEntry(id){let x=all().find(z=>z.id===id); editId=id; let imported=x.source==='Imported XLSX'; mtitle.textContent=imported?'Attach Bill / Payment Picture':'Edit Entry'; mdate.value=x.date||'';mfy.value=x.fy;mpart.value=x.particular;mcr.value=x.credit??'';mdr.value=x.debit??'';mnotes.value=x.notes||''; [mdate,mfy,mpart,mcr,mdr,mnotes].forEach(el=>el.disabled=imported); mphoto.value='';pendingPhoto=null;let im=imgs()[id];photoPreview.innerHTML=im?`<img class=thumb src="${im}"><button class="photoBtn" onclick="removePhoto()">Remove picture</button>`:'';modalBack.style.display='flex'}
function closeModal(){modalBack.style.display='none';[mdate,mfy,mpart,mcr,mdr,mnotes].forEach(el=>el.disabled=false)}
function readPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>compress(r.result);r.readAsDataURL(f)}
function compress(src){let im=new Image();im.onload=()=>{let max=1280,sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pendingPhoto=c.toDataURL('image/jpeg',.78);photoPreview.innerHTML=`<img class=thumb src="${pendingPhoto}">`};im.src=src}
function removePhoto(){let m=imgs();if(editId)delete m[editId];saveImgs(m);photoPreview.innerHTML='';pendingPhoto=null;render()}
function saveEntry(){let src=SOURCE_LEDGER.find(x=>x.id===editId); if(src){if(pendingPhoto){let m=imgs();m[src.id]=pendingPhoto;saveImgs(m)} closeModal();render();return} let cr=mcr.value===''?null:+mcr.value,dr=mdr.value===''?null:+mdr.value;if(cr==null&&dr==null){alert('Enter Credit/Bill or Debit/Payment amount');return} if(cr!=null&&dr!=null){alert('Use either Credit or Debit for one entry');return} let u=user(),id=editId; let rec={id:id||'user-'+Date.now(),fy:mfy.value,date:mdate.value,particular:mpart.value.trim()|| (cr!=null?'Bill':'Payment'),credit:cr,debit:dr,balance:null,notes:mnotes.value.trim(),sourceRow:null,source:'User entry'}; let pos=u.findIndex(x=>x.id===id); if(pos>=0)u[pos]=rec; else u.push(rec); saveUser(u); if(pendingPhoto){let m=imgs();m[rec.id]=pendingPhoto;saveImgs(m)} closeModal();render()}
function exportData(){let payload={exportedAt:new Date().toISOString(),sourceStats:SOURCE_STATS,sourceLedger:SOURCE_LEDGER,userEntries:user(),images:imgs()};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='VKS_Ledger_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function showIssues(){let flags=SOURCE_LEDGER.filter(x=>!x.date);alert(flags.length+' imported transaction(s) have no date in the original workbook. They are preserved without guessing.\n\n'+flags.slice(0,8).map(x=>x.fy+' row '+x.sourceRow+' — '+x.particular+' '+money(x.credit??x.debit)).join('\n'))}
init();
</script></body></html>
