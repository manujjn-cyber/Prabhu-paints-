name: Build VKS Ledger APK
on:
  push:
    branches: [main]
    paths: ["ledger-android/**", ".github/workflows/vks-ledger-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - working-directory: ledger-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VKS-Party-Ledger-APK
          path: ledger-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
